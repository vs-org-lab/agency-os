name: End-to-end

# The end-to-end suite runs against the app started on the runner itself (`next build` and
# `next start`), not a Vercel preview: the Hobby plan's function CPU is kept for staging.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end and accessibility
    # Drafts and forks skip the suite; it runs when the PR is ready for review.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Every run seeds and signs in against the same dev database, so runs must not overlap.
    concurrency:
      group: e2e-preview-database
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      CI: true
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PREVIEW_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_VERCEL_ENV: preview
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.PREVIEW_DATABASE_DIRECT_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.PREVIEW_SUPABASE_SECRET_KEY }}
      SESSION_ACTIVITY_SECRET: ${{ secrets.PREVIEW_SESSION_ACTIVITY_SECRET }}
      INNGEST_EVENT_KEY: ${{ secrets.PREVIEW_INNGEST_EVENT_KEY }}
      INNGEST_SIGNING_KEY: ${{ secrets.PREVIEW_INNGEST_SIGNING_KEY }}
      PUBLIC_LINK_SECRET: ${{ secrets.PREVIEW_PUBLIC_LINK_SECRET }}
      BRAND_HUB_TOKEN_SECRET: ${{ secrets.PREVIEW_BRAND_HUB_TOKEN_SECRET }}
      PUBLIC_ORGANIZATION_SLUG: e2e-studio
      APP_BASE_URL: http://localhost:3000
      EMAIL_TRANSPORT: capture
      CALENDAR_PROVIDER: fake
      TRANSCRIPTION_PROVIDER: fake
      APPLY_IP_LIMIT_PER_HOUR: 1000
      DOMAIN_PROVIDER: fake
      RECEIPT_READER: fake
      BRAND_HUB_SITE_URL: http://localhost:3001
      BRAND_HUB_SITE_ORIGINS: http://localhost:3001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build the app
        run: pnpm --filter web build
      - name: Start the app on the runner
        run: |
          pnpm --filter web start > next.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/sign-in && exit 0
            sleep 2
          done
          cat next.log
          exit 1
      - run: pnpm --filter web e2e:seed
      - name: Build the Brand Hub site for the end-to-end tests
        run: pnpm --filter brand-hub build
        env:
          NEXT_PUBLIC_OS_URL: http://localhost:3001/os
          NEXT_PUBLIC_OS_PAGES_URL: http://localhost:3000
      - run: pnpm --filter web e2e
      - if: failure() || cancelled()
        run: tail -200 next.log
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
