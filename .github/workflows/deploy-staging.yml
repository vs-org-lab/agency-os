name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  isolation-gate:
    name: Database, RLS and isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      AUTH_SITE_URL: http://localhost:3000
      AUTH_REDIRECT_URLS: http://localhost:3000/**
      AUTH_PREVIEW_REDIRECT_URLS: http://localhost:3000/**
      SMTP_HOST: localhost
      SMTP_USER: ci@example.com
      SMTP_PASSWORD: unused
      SMTP_SENDER_NAME: Agency OS
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database and auth only)
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm test:db

  migrate:
    name: Apply migrations to staging
    needs: isolation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - name: Push migrations
        run: supabase db push --db-url "${{ secrets.STAGING_DATABASE_DIRECT_URL }}" --yes
      - name: Push auth configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AUTH_SITE_URL: https://${{ vars.STAGING_DOMAIN }}
          AUTH_REDIRECT_URLS: https://${{ vars.STAGING_DOMAIN }}/**
          AUTH_PREVIEW_REDIRECT_URLS: https://${{ vars.STAGING_DOMAIN }}/**
          SMTP_HOST: smtp.gmail.com
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER_NAME: Agency OS
        run: supabase config push --project-ref "${{ vars.STAGING_SUPABASE_PROJECT_REF }}" --yes

  deploy:
    name: Vercel staging
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.STAGING_NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_VERCEL_ENV: staging
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      CI: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global vercel@62.4.0
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Remove git metadata
        run: rm -rf .git
      - name: Deploy
        id: deploy
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} \
            --env NEXT_PUBLIC_SUPABASE_URL="${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --env NEXT_PUBLIC_SENTRY_DSN="${{ secrets.STAGING_NEXT_PUBLIC_SENTRY_DSN }}" \
            --env DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            --env SUPABASE_SECRET_KEY="${{ secrets.STAGING_SUPABASE_SECRET_KEY }}" \
            --env SESSION_ACTIVITY_SECRET="${{ secrets.STAGING_SESSION_ACTIVITY_SECRET }}" \
            --env INNGEST_EVENT_KEY="${{ secrets.STAGING_INNGEST_EVENT_KEY }}" \
            --env INNGEST_SIGNING_KEY="${{ secrets.STAGING_INNGEST_SIGNING_KEY }}" \
            --env PUBLIC_LINK_SECRET="${{ secrets.STAGING_PUBLIC_LINK_SECRET }}" \
            --env PUBLIC_ORGANIZATION_SLUG=aurion-creative \
            --env APP_BASE_URL="https://${{ vars.STAGING_DOMAIN }}" \
            --env EMAIL_TRANSPORT=smtp \
            --env SMTP_HOST=smtp.gmail.com \
            --env SMTP_PORT=465 \
            --env SMTP_USER="${{ secrets.SMTP_USER }}" \
            --env SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            --env CALENDAR_PROVIDER="${{ secrets.STAGING_GOOGLE_CLIENT_ID != '' && 'google' || 'fake' }}" \
            --env GOOGLE_CLIENT_ID="${{ secrets.STAGING_GOOGLE_CLIENT_ID }}" \
            --env GOOGLE_CLIENT_SECRET="${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}" \
            --env TRANSCRIPTION_PROVIDER="${{ secrets.STAGING_GROQ_API_KEY != '' && 'groq' || 'fake' }}" \
            --env GROQ_API_KEY="${{ secrets.STAGING_GROQ_API_KEY }}" \
            --env BRAND_HUB_SITE_URL="https://${{ vars.STAGING_BRAND_HUB_DOMAIN }}" \
            --env BRAND_HUB_SITE_ORIGINS="https://${{ vars.STAGING_BRAND_HUB_DOMAIN }},http://localhost:3001" \
            --env BRAND_HUB_TOKEN_SECRET="${{ secrets.STAGING_BRAND_HUB_TOKEN_SECRET }}")
          host="${url#https://}"
          curl --fail-with-body -sS -o /dev/null -X POST \
            "https://api.vercel.com/v2/deployments/${host}/aliases?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"alias\":\"${{ vars.STAGING_DOMAIN }}\"}"
          echo "url=https://${{ vars.STAGING_DOMAIN }}" >> "$GITHUB_OUTPUT"

  brand-hub-site:
    name: Brand Hub site staging
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.BRAND_HUB_VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_OS_URL: https://${{ vars.STAGING_DOMAIN }}
      CI: true
    defaults:
      run:
        working-directory: apps/brand-hub
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global vercel@62.4.0
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy the static site as the project's production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  e2e:
    name: End-to-end and accessibility
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_BASE_URL: https://${{ vars.STAGING_DOMAIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      DATABASE_DIRECT_URL: ${{ secrets.STAGING_DATABASE_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e:seed
      - name: Build the Brand Hub site for the end-to-end tests
        run: pnpm --filter brand-hub build
        env:
          NEXT_PUBLIC_OS_URL: http://localhost:3001/os
          NEXT_PUBLIC_OS_PAGES_URL: https://${{ vars.STAGING_DOMAIN }}
      - name: End-to-end tests without public application writes, fake transcription or captured emails
        run: pnpm --filter web e2e --grep-invert "@public-writes|@fake-transcription|@captured-email"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
