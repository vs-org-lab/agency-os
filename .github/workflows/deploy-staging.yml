name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  isolation-gate:
    name: Database, RLS and isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      AUTH_SITE_URL: http://localhost:3000
      AUTH_REDIRECT_URLS: http://localhost:3000/**
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database and auth only)
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm test:db

  migrate:
    name: Apply migrations to staging
    needs: isolation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - name: Push migrations
        run: supabase db push --db-url "${{ secrets.STAGING_DATABASE_DIRECT_URL }}" --yes
      - name: Push auth configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AUTH_SITE_URL: https://${{ vars.STAGING_DOMAIN }}
          AUTH_REDIRECT_URLS: https://${{ vars.STAGING_DOMAIN }}/**
        run: supabase config push --project-ref "${{ vars.STAGING_SUPABASE_PROJECT_REF }}" --yes

  deploy:
    name: Vercel staging
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.STAGING_NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_VERCEL_ENV: staging
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      CI: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global vercel@62.4.0
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Remove git metadata
        run: rm -rf .git
      - name: Deploy
        id: deploy
        timeout-minutes: 10
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} \
            --env NEXT_PUBLIC_SUPABASE_URL="${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --env NEXT_PUBLIC_SENTRY_DSN="${{ secrets.STAGING_NEXT_PUBLIC_SENTRY_DSN }}" \
            --env DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            --env SUPABASE_SECRET_KEY="${{ secrets.STAGING_SUPABASE_SECRET_KEY }}" \
            --env SESSION_ACTIVITY_SECRET="${{ secrets.STAGING_SESSION_ACTIVITY_SECRET }}" \
            --env INNGEST_EVENT_KEY="${{ secrets.STAGING_INNGEST_EVENT_KEY }}" \
            --env INNGEST_SIGNING_KEY="${{ secrets.STAGING_INNGEST_SIGNING_KEY }}")
          vercel alias set "$url" "${{ vars.STAGING_DOMAIN }}" --token=${{ secrets.VERCEL_TOKEN }}
          echo "url=https://${{ vars.STAGING_DOMAIN }}" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end and accessibility
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_BASE_URL: https://${{ vars.STAGING_DOMAIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      DATABASE_DIRECT_URL: ${{ secrets.STAGING_DATABASE_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e:seed
      - run: pnpm --filter web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
